name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    name: Build, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

  integration:
    name: Integration tests against real databases
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: payload
          POSTGRES_PASSWORD: payload
          POSTGRES_DB: payload_blog
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U payload -d payload_blog"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      mongo:
        image: mongo:8
        env:
          MONGO_INITDB_ROOT_USERNAME: payload
          MONGO_INITDB_ROOT_PASSWORD: payload
        ports:
          - 27018:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://payload:payload@localhost:5433/payload_blog?schema=public
      PAYLOAD_INTERNAL_URL: mongodb://payload:payload@localhost:27018/payload_internal?authSource=admin
      PAYLOAD_SECRET: ci-secret
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the adapter
        run: pnpm build

      - name: Create the schema
        run: pnpm --filter @repo/blog db:push

      - name: Generate the Prisma client
        run: pnpm --filter @repo/blog db:generate

      - name: Integration tests
        run: pnpm --filter @repo/blog test
